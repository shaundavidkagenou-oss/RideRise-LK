# RideRise LK — Gradle settings for the Android Studio build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Firebase Messaging (and Play Services) depend on AndroidX.
android.useAndroidX=true

# The two build flavours share android/res, which is compiled per-variant.
android.nonTransitiveRClass=true
